<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="TODO.css">

    <title>TODO</title>
</head>

<body>

    <main class="todo-app">

        <!-- =========================
             NAGŁÓWEK
             ========================= -->

        <h1>Moje Zadania</h1>


        <!-- =========================
             DODAWANIE ZADANIA
             ========================= -->

        <div id="addTaskContainer">

            <input
                type="text"
                id="taskInput"
                placeholder="Co masz do zrobienia?"
            >
            
            <select id="taskCategory">
            <option value="projects">Projekty</option>
            <option value="personal">Osobiste</option>
            </select>

            <button id="addTaskButton">
                + Dodaj Zadanie
            </button>

        </div>


        <!-- =========================
             STATYSTYKI
             ========================= -->

        <div id="taskStatistics">

            <div class="task-section">

                <div class="task-section-title">
                    Wszystkie Zadania
                </div>

                <div class="number" id="allTasksCount">
                    0
                </div>

            </div>


            <div class="task-section">

                <div class="task-section-title">
                    Do Zrobienia
                </div>

                <div class="number" id="doZrobieniaCount">
                    0
                </div>

            </div>


            <div class="task-section">

                <div class="task-section-title">
                    Zrobione
                </div>

                <div class="number" id="ZrobioneCount">
                    0
                </div>

            </div>

        </div>


        <!-- =========================
             KATEGORIE
             ========================= -->

        <div id="categories">

            <button
                class="categoryButton active"
                data-category="all">
                Wszystkie
            </button>

            <button
                class="categoryButton"
                data-category="projects">
                Projekty
            </button>

            <button
                class="categoryButton"
                data-category="personal">
                Osobiste
            </button>

        </div>


        <!-- =========================
             LISTA ZADAŃ
             ========================= -->

    <div id="taskContent">

        <div id="taskListContainer">

        </div>

        <div id="taskDetails">

        </div>
    </div>
    </main>


    <!-- JavaScript -->
    <script src="TODO.js"></script>

</body>

</html>
